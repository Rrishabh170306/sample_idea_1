[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gov-scheme-navigator-backend"
version = "0.1.0"
description = "FastAPI backend scaffold for the AI Government Scheme Navigator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "redis>=5.0",
  "neo4j>=5.20",
  "langgraph>=0.2",
  "langchain>=0.2",
  "scrapy>=2.11",
  "scrapy-playwright>=0.0.34",
  "playwright>=1.45",
  "pymupdf>=1.24",
  "pytesseract>=0.3.10",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "prometheus-client>=0.19",
  "sentence-transformers>=2.2",
  "asyncpg>=0.27",
  "pgvector>=0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

llm = [
  # HTTP client for OpenRouter/OpenAI-compatible API
  "httpx>=0.23",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
