apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: gov-scheme-navigator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: gov-scheme-navigator-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://user:pass@postgres:5432/govschemes
            - name: NEO4J_URI
              value: bolt://neo4j:7687
            - name: REDIS_URL
              value: redis://redis:6379/0
