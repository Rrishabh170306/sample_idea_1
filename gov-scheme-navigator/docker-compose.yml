services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - neo4j
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg://user:pass@postgres:5432/govschemes
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379/0
      # LLM configuration (set to 'claude' for self-hosted Claude endpoints)
      LLM_PROVIDER: ""
      LLM_API_URL: ""
      LLM_API_KEY: ""

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: govschemes
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - pgdata:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4jdata:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  scraper:
    build: ./backend
    command: ["scrapy", "crawl", "myscheme"]
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  neo4jdata:
